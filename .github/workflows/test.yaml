name: test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache composer vendor
        uses: actions/cache@v4
        with:
          path: ./src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ローカルと同じ固定PHP・Composer・MySQLで、依存関係導入・DB起動・
      # Laravelのbootstrap確認・テスト実行までを Issue #210 の `make check` に委ねる。
      # composer:latest は使用しない。`make check` は検証専用のCompose project
      # （docker-compose.check.yml、Issue #233）だけを使い、成功・失敗に
      # かかわらず自分自身でそのprojectをcleanupするため、このworkflowから
      # 追加でcompose downを呼ぶ必要はない。
      - name: make check
        run: make check

      # `make check` が実行する `composer check` は `--log-junit result.xml` 付きで
      # テストを実行するため、`src/result.xml` はコンテナ終了後もbind mount経由で
      # ホスト（Runner）側に残る。テストを二重実行せず、そのXMLをそのまま使う。
      - name: build html test report
        if: ${{ github.event_name == 'push' }}
        run: |
          curl -fsSL -o lib/phpunit.xslt https://gist.githubusercontent.com/jrfnl/3c28ea6d9b07fd48656d/raw/aaeb0b879647b1cf1dbfd461a2c4a8e292be738d/phpunit.xslt
          mkdir -p report
          php lib/convert_html.php

      - name: store test report
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report

  # PHP 8.5系の互換確認。本番・開発用は引き続きPHP 8.2.30のまま。
  # Issue #215時点ではnette/schema・nette/utilsのPHP上限(8.4)により
  # `composer install`が失敗する既知の状態があり、一時的な判定ロジックで
  # bootstrap以降を未実施のまま成功扱いにしていたが、Issue #216のLaravel 9
  # 更新でこれらの間接依存がPHP 8.5対応版へ更新され、`composer install`が
  # PHP 8.5.9でも成功するようになったため、一時的な処理を撤去し`test`
  # ジョブと同じ通常のフロー（`make check-php85`が成功すればジョブも成功、
  # 失敗すればジョブも失敗）に戻した。
  php85-compat:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache composer vendor (php8.5)
        uses: actions/cache@v4
        with:
          path: ./src/vendor
          key: ${{ runner.os }}-composer-php85-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php85-

      # PHP 8.2.30向けの`make check`と同じ手順を、`docker-compose.check.yml`に
      # `docker-compose.check-php85.yml`を重ねた専用のCompose project
      # （holidays-webhook-server-check-php85）でだけ実行する。
      - name: make check-php85
        run: make check-php85

  publish-test-report:
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: report

      - name: publish test report
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: report

  notify:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - test
      - publish-test-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          fields: repo,message,action,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
