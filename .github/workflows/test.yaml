name: test

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache composer vendor
        uses: actions/cache@v6
        with:
          path: ./src/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ローカルと同じ固定PHP・Composer・MySQLで、依存関係導入・DB起動・
      # Laravelのbootstrap確認・テスト実行までを Issue #210 の `make check` に委ねる。
      # composer:latest は使用しない。`make check` は検証専用のCompose project
      # （docker-compose.check.yml、Issue #233）だけを使い、成功・失敗に
      # かかわらず自分自身でそのprojectをcleanupするため、このworkflowから
      # 追加でcompose downを呼ぶ必要はない。webサービスのPHPはIssue #220で
      # PHP 8.5.9が標準になっており、`make check`自身がPHP_VERSIONを
      # 機械的に検証する。
      - name: make check
        run: make check

      # `make check` が実行する `composer check` は `--log-junit result.xml` 付きで
      # テストを実行するため、`src/result.xml` はコンテナ終了後もbind mount経由で
      # ホスト（Runner）側に残る。テストを二重実行せず、そのXMLをそのまま使う。
      - name: build html test report
        if: ${{ github.event_name == 'push' }}
        run: |
          curl -fsSL -o lib/phpunit.xslt https://gist.githubusercontent.com/jrfnl/3c28ea6d9b07fd48656d/raw/aaeb0b879647b1cf1dbfd461a2c4a8e292be738d/phpunit.xslt
          mkdir -p report
          php lib/convert_html.php

      - name: store test report
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report

  publish-test-report:
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: report

      - name: publish test report
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: report

  notify:
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - test
      - publish-test-report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          fields: repo,message,action,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
