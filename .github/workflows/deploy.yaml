name: deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: export ssh keys
        run: |
          mkdir -p ~/.ssh
          echo -e "${{ secrets.ID_RSA }}" > ~/.ssh/id_rsa
          echo ${{ secrets.KNOWN_HOSTS }} > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa

      # test.yaml（`make check`）と同じ docker/web/Dockerfile の既定イメージ
      # （PHP 8.5.9 + Composer 2.8.12、Issue #220でCIの標準に昇格済み）を
      # ビルドし、依存関係を生成する環境をCIで検証済みの環境へ揃える。
      # 旧手順の `composer` 固定外イメージ（floating tag）は使用しない。
      - name: build production PHP/Composer image
        run: docker build --pull --tag hw-deploy-php ./docker/web

      # 本番用vendorは常に --no-dev で、cacheの有無に関わらずこのステップで
      # 生成する。test.yaml の vendor cache（dev依存込み）とは完全に独立して
      # おり、production用cache自体を持たない（Issue #226）。
      #
      # 理由: deployは `v*` タグpush時のみ起動する低頻度の処理であり、
      # cacheによる高速化の価値より、本番へdev依存込みvendorが混入する
      # リスク（cache hitでinstall自体をskipしてしまう既存の問題）を
      # 完全に排除できることを優先した。cache自体を持たなければ、
      # 「cache hit時にskipしてしまう」という失敗モードが構造的に発生しない。
      - name: composer install (production, no-dev)
        run: |
          docker run --rm \
            --volume "$PWD/src:/var/www/html" \
            --workdir /var/www/html \
            --user "$(id -u):$(id -g)" \
            --env COMPOSER_HOME=/tmp/composer \
            hw-deploy-php \
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: delete server files
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
             "cd ${{ secrets.SSH_DIR }} && ls | grep -v -E 'logs' | xargs rm -rf"

      - name: rsync
        run: |
          cd src && rsync -av \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='logs' \
            --exclude='phpunit.xml' \
            --exclude='.env' \
            --exclude='tests' \
            . ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_DIR }}

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,action,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
