version: 2
updates:
  # Composer (src/composer.json)
  - package-ecosystem: "composer"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      # patch/minorはPRをまとめて確認負荷を下げるためのグルーピングであり、
      # マージ条件（test成功+人間Approve必須のauto-merge）には影響しない。
      # patch/minor/majorいずれも通常PRと同じマージ条件が適用される。
      composer-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      composer-minor:
        applies-to: version-updates
        update-types:
          - "minor"
      # majorはグルーピングしない（個別PRのまま）。

  # GitHub Actions (.github/workflows/*.yaml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    groups:
      actions-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
      # majorはグルーピングしない（個別PRのまま）。
