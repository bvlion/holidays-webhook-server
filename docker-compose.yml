services:
  web:
    container_name: hw_web
    build: ./docker/web
    ports:
      - 8000:80
    tty: true
    stdin_open: true
    volumes:
      - ./src:/var/www/html
      - ./docker/web/php.ini:/usr/local/etc/php/php.ini
      - ./src/logs:/var/log/apache2
    depends_on:
      - db

  db:
    container_name: hw_db
    build: ./docker/db
    restart: always
    environment:
      TZ: Asia/Tokyo
      MYSQL_DATABASE: hw
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3346:3306"
    volumes:
      - ./docker/db/conf:/etc/mysql
      - ./src/logs:/var/log/mysql
      - ./docker/db/sql:/docker-entrypoint-initdb.d

  db-check:
    container_name: db_ckecker
    build: ./docker/checker
    environment:
      TZ: Asia/Tokyo
      MYSQL_PWD: password
    command:
      - /bin/bash
      - -c
      - |
        for attempt in $$(seq 1 30); do
          mysqladmin ping -h db -u user --silent && exit 0
          sleep 1
        done
        exit 1
