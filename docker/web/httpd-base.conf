<VirtualHost *:80>
  DocumentRoot /var/www/html/public

  <Directory /var/www/html/public>
    AllowOverride All
  </Directory>

  ErrorLog /var/log/apache2/error.log
  LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" without_query
  CustomLog /var/log/apache2/access.log without_query
</VirtualHost>
